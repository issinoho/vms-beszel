# Upstream beszel release whose agent protocol this port implements.
# The agent is Go and there is no Go for OpenVMS, so nothing here is compiled
# from upstream (docs/DECISIONS.md D1).  The pinned tree is the specification:
# the wire structs (internal/common, internal/entities) and the reference hub
# that the conformance tests run against (D6).
UPSTREAM_NAME=beszel
UPSTREAM_VERSION=0.21.0
UPSTREAM_REPO=https://github.com/henrygd/beszel.git
UPSTREAM_TAG=v0.21.0
# Commit the annotated tag points to; tools/fetch.sh refuses any other.
UPSTREAM_COMMIT=ec96c134660c998f7eb044e349e3715b65733fe1
# Our level on top of the upstream protocol version (0.21.0-vms1)
VMS_PATCH_LEVEL=1
# TLS, SHA-256 and Ed25519: VSI's SSL3 kit (OpenSSL 3.0), a kit prerequisite.
SSL_KIT=SSL3
# PCSI product BESZEL_AGENT; logical names and directories use BESZEL$.
KIT_PRODUCT=BESZEL_AGENT
